# A suíte é a evidência deste projeto — 21 arquivos, 1.217 testes, e nada rodava fora da máquina do autor.
#
# `npm test` é o comando inteiro de propósito: o `pretest` do npm roda o typecheck sobre `src/` E
# `test/` antes de qualquer teste, e `scripts/test.mjs` limita a suíte por relógio e mata o grupo de
# processos — uma suíte travada vira exit 124 aqui, e não um job pendurado até o teto do runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Disparo manual, e ele existe por um motivo concreto: em 2026-08-26 dois pushes pareceram não
  # produzir run nenhum — a API não devolvia check-run algum seis minutos depois — e não havia como
  # pedir um. (Eram os runs atrasando, não o CI parado; os dois apareceram e passaram.) Sem esta
  # linha, a única forma de testar "o CI ainda dispara?" é empurrar um commit vazio.
  workflow_dispatch:

# Um push logo em cima do outro cancela o job anterior: o interessante é sempre o topo do branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Três sistemas operacionais, e não por simetria: o vault é um CAMINHO DE ARQUIVO, e caminho é a
  # única coisa deste projeto que muda de forma conforme o sistema. O código normaliza tudo para `/`
  # internamente (`relocate.ts`, `learn.ts`) e volta para o separador nativo no `scanner`, o que
  # PARECE certo — e ninguém nunca rodou nada disso fora do Linux. O Obsidian é majoritariamente
  # Windows: o primeiro usuário de Windows não pode continuar sendo a suíte de testes.
  #
  # `fail-fast: false` porque o interessante aqui é justamente QUAIS plataformas quebram. Um job
  # cancelando os outros esconde a resposta na primeira falha.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Node 26 e não a `engines` (>= 20): `test/frontmatter.test.ts` roda o `parseFile` real num
      # processo filho fixado num TZ, e esse filho é `node <arquivo>.ts` — depende do type stripping
      # do próprio Node. Um runner mais antigo falha ali por causa da versão, não do código.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Os testes que envolvem git criam repositórios descartáveis e configuram a identidade neles;
      # esta é a rede de segurança para qualquer `git` que rode fora de um desses.
      - name: Identidade do git para os repositórios de teste
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@example.com'
          git config --global init.defaultBranch main

      - run: npm test

      # Depois dos testes: o `dist/` é o que o servidor MCP registrado realmente executa, então um
      # build quebrado é um servidor quebrado mesmo com a suíte verde.
      - run: npm run build

      # E um build que compila ainda pode não SERVIR: o entrypoint que se acha biblioteca sai 0 sem
      # imprimir nada. O smoke sobe o `dist/` de verdade contra um vault descartável e exige as nove
      # tools no `tools/list`.
      - run: npm run smoke

  # O job que torna `engines.node >= 20` uma afirmação verificada em vez de uma promessa.
  #
  # A suíte não pode rodar aqui — `test/frontmatter.test.ts` depende do type stripping do runtime —
  # mas o que a gente PUBLICA é `dist/`, JavaScript compilado, e isso roda. Se o piso subir um dia,
  # é este job que falha primeiro, e a `engines` desce junto.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run smoke
