# O release, inteiro, sem ninguém rodar comando.
#
# Dar merge em `main` de uma versão que ainda não tem tag publica essa versão: npm, depois a tag
# e o GitHub Release, depois o MCP Registry. A decisão de publicar é o commit que muda a versão
# (e que passou por um PR); tudo o que vem depois dela é mecânico, e o que é mecânico e feito à
# mão é o que se esquece — as sete primeiras tags deste repositório não tinham Release, e o
# servidor nunca chegou ao MCP Registry.
#
# A ORDEM não é gosto. O registry prova a posse do nome lendo o `mcpName` de dentro do tarball
# que está no npm, então o npm vem antes dele. E a tag só nasce depois do npm: uma tag de uma
# versão que não pôde ser publicada é uma mentira no histórico.
#
# CADA PASSO PODE SER REPETIDO. Se o job morrer no meio, "Re-run failed jobs" continua de onde
# parou: o que já foi publicado é pulado, e não repetido nem tratado como erro.
#
# O QUE NÃO ESTÁ AQUI, porque não dá para pôr: o cadastro deste workflow como trusted publisher do
# pacote no npm, que é feito uma vez, por quem é dono do pacote, com o segundo fator dele:
#
#   npm trust github @andreymudri/vault-mcp --file release.yml --repo andreymudri/vault-mcp --allow-publish
#
# Sem ele o passo do npm falha, antes de qualquer tag — e o npm descarta um cadastro que não
# publicar nada em dois dias, então ele é feito perto do primeiro release.
name: Release

on:
  push:
    branches: [main]
  # À mão, para repetir um release que parou no meio quando "Re-run failed jobs" não serve mais.
  # Roda todos os passos, cada um conferindo se já foi feito.
  workflow_dispatch:

# O token padrão só lê. O único job que escreve alguma coisa pede o que precisa, lá.
permissions:
  contents: read

# Um release de cada vez, e nenhum é cancelado no meio por um push que chegou depois.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Há o que publicar? Quase todo push em `main` não muda a versão, e para eles o workflow acaba
  # aqui, em segundos.
  plan:
    name: Há versão para publicar?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # Actions fixadas pelo SHA do commit, com a tag ao lado: uma tag pode ser movida para outro
      # commit por quem controla o repositório da action, um SHA não. O Dependabot atualiza os dois.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # `release-check` recusa uma versão cujos arquivos não concordam entre si ou que não tem
      # seção no CHANGELOG. Roda em todo push: uma versão mudada pela metade deixa este job
      # vermelho em vez de ser publicada.
      - name: Versão, e se ela já tem tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(node scripts/release-check.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            release=true
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            release=false
          else
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "v$version — publicar: $release" >> "$GITHUB_STEP_SUMMARY"

  # Tudo o que o CI confere, de novo, no commit exato que vai ser publicado — e o tarball que sai
  # daqui é o que o job seguinte publica, byte a byte. Este job roda código de terceiros (as
  # dependências, o que os testes executam) e por isso não tem identidade nenhuma além de ler o
  # repositório.
  verify:
    name: Verificar e empacotar
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Identidade do git para os repositórios de teste
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@example.com'
          git config --global init.defaultBranch main

      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run smoke

      - name: Empacotar
        run: |
          set -euo pipefail
          mkdir release
          npm pack --pack-destination release
          node scripts/release-notes.mjs "$VERSION" > release/notes.md
          cp server.json release/server.json

      # O que o usuário vai receber é o tarball, não o diretório de trabalho: instalado num prefixo
      # vazio, o `bin` que saiu DE LÁ tem de subir e responder as tools. É o que pega um `files`
      # que deixou alguma coisa de fora.
      #
      # O caminho do tarball é ABSOLUTO de propósito. Com `--prefix` o npm resolve um caminho
      # relativo a partir do prefixo, não o acha, e passa a lê-lo como o atalho `usuario/repo` do
      # GitHub: `release/<pacote>.tgz` virava um repositório alheio a buscar.
      - name: Smoke do tarball instalado
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/installed"
          npm install --prefix "$prefix" --no-audit --no-fund "$PWD"/release/*.tgz
          node scripts/smoke.mjs "$prefix/node_modules/@andreymudri/vault-mcp/dist/server/index.js"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  # O único job com identidade de publicação. Ele não faz checkout, não instala dependência e não
  # roda nada do repositório: recebe o tarball já verificado e o entrega. Quem roda com
  # `id-token: write` pode pedir um token em nome deste workflow, então aqui não entra código que
  # não seja o do npm, o do `gh` e o do `mcp-publisher` verificado.
  publish:
    name: Publicar
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # a tag e o GitHub Release
      id-token: write # a identidade OIDC: npm (trusted publishing) e MCP Registry
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Versão fixa, conferida abaixo contra a assinatura do workflow de release do próprio
      # registry. Nunca `releases/latest`: é um binário que roda com a identidade deste job.
      MCP_PUBLISHER_VERSION: v1.8.13
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Só pelo npm: a publicação por OIDC exige npm >= 11.5.1, que vem com este Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Sem token nenhum: o npm troca a identidade OIDC deste workflow por uma credencial de
      # publicação, e gera a atestação de proveniência sozinho. O que autoriza é o cadastro do
      # trusted publisher (ver o topo do arquivo).
      - name: npm
        run: |
          set -euo pipefail
          tarball="$PWD/$(ls release/*.tgz)"
          name="$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION já está no npm; nada a publicar."
          else
            npm publish "$tarball" --access public --provenance
          fi

      # A tag nasce aqui, no commit que foi verificado, e só agora que o npm aceitou a versão.
      # O SHA inteiro: o curto é recusado (`Release.target_commitish is invalid`).
      - name: Tag e GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v$VERSION" --notes-file release/notes.md
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Baixar e verificar o mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # Por último, porque depende do npm: o registry confere o `mcpName` no pacote publicado. O
      # login é pela mesma identidade OIDC, que dá direito ao namespace `io.github.<dono>` do
      # repositório — nenhum segredo guardado.
      - name: MCP Registry
        run: |
          set -euo pipefail
          name="$(node -p "require('./release/server.json').name")"
          encoded="$(node -p "encodeURIComponent(process.argv[1])" "$name")"
          if curl --fail --silent --show-error --output /dev/null \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$encoded/versions/$VERSION" 2>/dev/null; then
            echo "$name $VERSION já está no MCP Registry; nada a publicar."
          else
            ./mcp-publisher login github-oidc
            (cd release && ../mcp-publisher publish)
          fi

      - name: Resumo
        run: |
          {
            echo "### v$VERSION publicada"
            echo "- npm: https://www.npmjs.com/package/@andreymudri/vault-mcp/v/$VERSION"
            echo "- GitHub: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            echo "- MCP Registry: io.github.andreymudri/vault-mcp"
          } >> "$GITHUB_STEP_SUMMARY"
